name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm test
      # Workspaces without these scripts (web/backend before scaffolding) are skipped.
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
